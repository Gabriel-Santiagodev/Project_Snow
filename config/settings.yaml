# ==============================================================================
# PROJECT SNOW - SYSTEM CONFIGURATION
# ==============================================================================
# Version: 1.0
# Last Updated: January 10, 2026
# Author: Roberto Carlos Jimenez Rodriguez
# Purpose: Centralized configuration
#
# IMPORTANT RULES:
# 1. Never hardcode values in Python code - always reference this file
# 2. All paths are relative to project root directory
# 3. Add comments for any non-obvious values
# ==============================================================================


# =============================================================================
# HARDWARE
# =============================================================================

hardware:

# =============================================================================
# CAMERAS VARIABLES
# =============================================================================
  cameras:
    camera1: 
      src: "rtsp://admin:snow2026@192.168.1.65"
      name: "Left Camera"
      resolution: [640, 480]
      enabled: true
      zones:
        capture_zone:
          coords: [160, 120, 480, 360]  # x_min, y_min, x_max, y_max (Center ROI)
    camera2:
      src: "rtsp://admin:snow2026@192.168.1.66"
      name: "Right Camera"
      resolution: [640, 480]
      enabled: true
      zones:
        capture_zone:
          coords: [160, 120, 480, 360]  # x_min, y_min, x_max, y_max (Center ROI)

# =============================================================================
# AUDIO VARIABLES
# =============================================================================

  audio:
    volume: 0.8
    cooldown_seconds: 2.0
    audio_files:
      testing_audio0_path: "data/audio/testing_audio0.mp3"
      testing_audio1_path: "data/audio/testing_audio1.mp3"
      alert_audio: "data/audio/alert_audio"

# =============================================================================
# GPIO PINS VARIABLES (BCM Numbering)
# =============================================================================
  pins:
    # Future task: Verify buttons are 3.3V compatible before connecting to GPIO
    emergency_light: 17  # BCM numbering (Physical pin 11)
    reset_button: 27     # BCM numbering (Physical pin 13)
    indicator_led: 18    # BCM numbering (Physical pin 12)
    # OLED Display (I2C — SDA/SCL are fixed hardware pins, not configurable via BCM)
    # SDA  -> Physical pin 3  (BCM GPIO2)
    # SCL  -> Physical pin 5  (BCM GPIO3)
    oled_sda: 2           # BCM numbering (Physical pin 3)  — I2C1 SDA
    oled_scl: 3           # BCM numbering (Physical pin 5)  — I2C1 SCL

# =============================================================================
# LIGHT SERVICE VARIABLES
# =============================================================================

  light:
    on_duration_seconds: 5  # Seconds the indicator LED stays on after a detection

# =============================================================================
# OLED SERVICE VARIABLES
# =============================================================================

  oled:
    i2c_port: 1           # I2C bus number (1 = /dev/i2c-1 on Raspberry Pi)
    i2c_address: 0x3C     # I2C address of the SSD1309 controller (default 0x3C)
    display_duration_seconds: 5  # Seconds "PERSONA DETECTADA" stays on screen

# =============================================================================
# SOFTWARE
# =============================================================================

software:

# =============================================================================
# AI & DETECTION VARIABLES
# =============================================================================
  ai_model:
    model_path: "data/models/best.pt"
    type: "yolov8"
    confidence_threshold: 0.85 # Once 0.85 is reached or over come, the detection is True
    hailo:
      enabled: true
  
  detection:
    obstruction_threshold: 5000 # Pixel change for obstruction

  camera_service:
    movement_threshold: 5.0 # Pixel change for movement detection
    freeze_timeout_seconds: 5.0 # Seconds before declaring camera frozen
    sequence_timeout_seconds: 10.0 # Time to complete C1 -> C2 sequence
    debug: true # Set to true to show camera windows with ROIs
    

# =============================================================================
# SYSTEM VARIABLES
# =============================================================================

system:
    max_thread_restarts: 3 